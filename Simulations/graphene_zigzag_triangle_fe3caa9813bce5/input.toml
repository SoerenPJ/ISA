[system]
lattice = "graphene"
formation_shape = "triangle" # rectangle | triangle
formation = "zigzag"
size_x = 5
size_y = 5
rotation_angle_deg = 0

# bond length (nm)
lattice_const = 0.14210

[hamiltonian]
t1 = -2.8
t2 = -2.8
mu = 0.0       #2.3
gamma = 0.05
spin_on = true


[simulation]
use_strict_solver = false
dt = 0.01
t0 = 0.0
t_max = 1000.0
a_tol = 1e-14
r_tol = 1e-12

[field]
intensity = 1e13
mode = "time_impulse" #time_impulse
phase = 0.0
omega =  0.2 #7.28 #3.434
t_shift = 250.0
sigma_gaus = 100      #60.07
sigma_ddf = 0.01
B_ext = false

[analysis]
save_rho_full = false     # full N^2 matrix (coherences); huge, only for Spin_matrix.py
save_spin_diag = true      # lean spin-resolved induced diagonal for the spin-density plots
# Must stay UNDER the Nyquist limit of the solver's time grid (~37 eV for the
# adaptive step this config produces). Above it the post-hoc DFT returns
# aliases, and dipole_acc multiplies those by omega^2 — the reason the old
# 2000 eV setting produced a spectrum whose maximum sat at 1984 eV.
# 30 eV = 150 harmonics of the 0.2 eV drive; only ~6 clear the noise floor.
omega_cut_off = 6
fourier_dt_fs = 0.01  # for pretty 0.001 or 0.005. HHG
run_sigma_ext = false
run_dipole_acc = true #true

[thermo]
T = 1.0
use_charge_doping = true # if true, ignore mu for Rho_0
Q_doping = 1.0            # total extra electrons relative to neutral

[features]
coulomb = true
coulomb_onsite_eV = 20.0     # NOTE: unused; onsite Coulomb comes from v(0) (graphene cRPA, ~15.7 eV)
hubbard_fd_fill = false
# Coulomb kernel v(R) used to build V_ee AND the Hubbard onsite U = v(0).
# Under "ohno", ohno_U_eV IS that onsite value and is the only knob for it: hubbard_U_eV
# is ignored (with a NOTE) so V_ee cannot end up a hybrid of two different U_0.
# Under "vvR", hubbard_U_eV still overrides the onsite as before.
# "vvR" = ab-initio rational fit (default, unchanged behaviour);
# "ohno" = analytic V(r) = e^2 / sqrt((e^2/U_0)^2 + r^2), r in Bohr, V in Hartree.
coulomb_kernel = "ohno"
ohno_U_eV = 11.2   # Ohno onsite V(0) in eV (= vvR(0) = 0.5777610 Ha exactly)
hubbard = true              # self-consistent Hubbard/UHF magnetic ground state (default U = vvR(0), same as V_ee onsite)
hubbard_hartree = true
hartree_scf = false
hubbard_U_eV =  15.7216760846 #3.64 #31.4434     # optional: 1.6 \pm 0.2*t1 override Hubbard U (eV); if unset/negative, uses vvR(0) ~15.7 eV
hubbard_seed = 0.5           # initial staggered moment for symmetry breaking
hubbard_mix = 0.02            # linear mixing factor for the self-consistency loop
self_consistent_phase = true # L1: no induced Peierls phases; set true for L2
zeeman_external = false
zeeman_induced = true        # L1: Biot-Savart B_ind -> Zeeman (requires spin_on=true)
