[system]
lattice = "graphene"
formation_shape = "triangle" # rectangle | triangle
formation = "zigzag"
size_x = 3
size_y = 3
rotation_angle_deg = 0

# bond length (nm)
lattice_const = 0.14210

[hamiltonian]
t1 = -2.8
t2 = -2.8
mu = 0.0
gamma = 0.05
spin_on = true

[simulation]
use_strict_solver = false
dt = 0.01
t0 = 0.0
t_max = 120.0
a_tol = 1e-10
r_tol = 1e-8

[field]
intensity = 0.0            # ZERO drive: control run — ground state must stay stationary
mode = "ddf"
phase = 0.0
omega = 3.9199926497999997
t_shift = 500.0
sigma_gaus = 100
sigma_ddf = 0.01
B_ext = false

[analysis]
save_rho_full = false
save_spin_diag = true
omega_cut_off = 6
fourier_dt_fs = 0.01
run_sigma_ext = false
run_dipole_acc = false

[thermo]
T = 300
use_charge_doping = false
Q_doping = 8.0

[features]
coulomb = true
coulomb_onsite_eV = 20.0
self_consistent_phase = true
zeeman_external = false
zeeman_induced = true
hubbard = true
